name: Deploy to Home Server

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Update screenshot references & commit
        env:
          GIT_URL: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        run: |
          npx @playwright/test test --update-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet tests/blog.spec.ts-snapshots/; then
            echo "No screenshot changes needed"
          else
            git remote set-url origin "$GIT_URL"
            git add tests/blog.spec.ts-snapshots/
            git commit -m "test: update screenshot references"
            git push origin main
          fi

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Build the app
        run: npm run build

      - name: Clear PM2 logs
        run: pm2 flush

      - name: Restart PM2 services
        run: pm2 reload ecosystem.config.cjs --update-env
