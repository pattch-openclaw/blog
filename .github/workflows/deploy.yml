name: Deploy to Home Server

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or whatever LTS version you're on locally
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Tests (Unit & E2E Screendiff)
        run: npm run test

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Build the app
        run: npm run build

      - name: Clear PM2 logs
        run: pm2 flush

      - name: Restart PM2 services
        run: pm2 reload ecosystem.config.cjs --update-env
