name: Deploy to Home Server

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Update screenshot references
        run: npx @playwright/test test --update-snapshots

      - name: Commit updated screenshots
        run: |
          git config user.name "Sam"
          git config user.email "sam@Sams-Virtual-Machine.local"
          if git diff --quiet tests/blog.spec.ts-snapshots/; then
            echo "No screenshot changes needed"
          else
            git add tests/blog.spec.ts-snapshots/
            git commit -m "test: update screenshot references"
            git push origin main
          fi

      - name: Run Tests (Unit & E2E Screendiff)
        run: npm run test

      - name: Build the app
        run: npm run build

      - name: Clear PM2 logs
        run: pm2 flush

      - name: Restart PM2 services
        run: pm2 reload ecosystem.config.cjs --update-env
